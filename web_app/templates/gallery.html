{% extends "base.html" %}

{% block title %}画像ギャラリー - Smart Grow System{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h1 class="display-6">
                <i class="fas fa-images text-success"></i> 画像ギャラリー
            </h1>
            <p class="text-muted">撮影した植物の画像をカレンダー表示</p>
        </div>
    </div>

    <!-- フィルター -->
    <div class="row mb-4">
        <div class="col-12 col-md-6 mb-2">
            <div class="btn-group w-100" role="group">
                <button type="button" class="btn btn-outline-success" onclick="changeMonth(-1)">
                    <i class="fas fa-chevron-left"></i> 前月
                </button>
                <button type="button" class="btn btn-success" id="current-month-btn" disabled>
                    <span id="current-month-text">読み込み中...</span>
                </button>
                <button type="button" class="btn btn-outline-success" onclick="changeMonth(1)">
                    次月 <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div class="col-12 col-md-6 mb-2">
            <select class="form-select" id="layer-select" onchange="loadGallery()">
                <option value="1">Layer 1</option>
                <!-- 他のレイヤーは必要に応じて追加 -->
            </select>
        </div>
    </div>

    <!-- カレンダー -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <!-- 曜日ヘッダー -->
                    <div class="calendar-header">
                        <div class="calendar-day-header">日</div>
                        <div class="calendar-day-header">月</div>
                        <div class="calendar-day-header">火</div>
                        <div class="calendar-day-header">水</div>
                        <div class="calendar-day-header">木</div>
                        <div class="calendar-day-header">金</div>
                        <div class="calendar-day-header">土</div>
                    </div>
                    
                    <!-- カレンダー本体 -->
                    <div id="calendar-grid" class="calendar-grid">
                        <!-- JavaScriptで動的生成 -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">読み込み中...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 画像がない場合のメッセージ -->
    <div class="row" id="no-images-message" style="display: none;">
        <div class="col-12">
            <div class="alert alert-info text-center">
                <i class="fas fa-info-circle"></i> この月に撮影された画像はありません
            </div>
        </div>
    </div>
</div>

<!-- 画像拡大モーダル -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="imageModalLabel">
                    <i class="fas fa-camera text-success"></i> <span id="modal-date"></span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- メイン画像 -->
                <div class="text-center mb-3">
                    <img id="modal-image" src="" class="img-fluid rounded" style="max-height: 500px;">
                </div>
                
                <!-- センサー情報 -->
                <div class="row mb-3" id="sensor-info">
                    <div class="col-6">
                        <div class="card bg-light">
                            <div class="card-body text-center py-2">
                                <small class="text-muted">🌡️ 温度</small>
                                <h6 class="mb-0" id="modal-temp">-</h6>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card bg-light">
                            <div class="card-body text-center py-2">
                                <small class="text-muted">💧 湿度</small>
                                <h6 class="mb-0" id="modal-humidity">-</h6>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- AI解析レポート -->
                <div id="ai-report-section" style="display: none;">
                    <hr>
                    <div class="card bg-light border-0">
                        <div class="card-body">
                            <h6 class="mb-3">
                                <i class="fas fa-robot text-success"></i> AI解析レポート
                            </h6>
                            <div id="gallery-ai-report-content">
                                <!-- AI解析レポートがここに表示される -->
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 同じ日の他の画像 -->
                <div id="same-day-images" style="display: none;">
                    <hr>
                    <h6><i class="fas fa-images"></i> この日の他の画像 (<span id="same-day-count"></span>枚)</h6>
                    <div class="row g-2" id="same-day-thumbnails">
                        <!-- サムネイルがここに表示される -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" onclick="navigateDay(-1)">
                    <i class="fas fa-arrow-left"></i> 前の日
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="navigateDay(1)">
                    次の日 <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<style>
/* カレンダーのスタイル */
.calendar-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 10px;
}

.calendar-day-header {
    text-align: center;
    font-weight: bold;
    padding: 10px;
    background-color: #f8f9fa;
    border-radius: 5px;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(100px, auto); /* 6行対応: 最小100px、コンテンツに応じて拡大 */
    gap: 5px;
}

.calendar-day {
    /* aspect-ratio: 1; ← 削除（6行の月で崩れるため） */
    min-height: 100px; /* 最小高さを確保 */
    border: 1px solid #dee2e6;
    border-radius: 5px;
    padding: 8px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.calendar-day:hover {
    background-color: #f8f9fa;
    transform: scale(1.05);
}

.calendar-day.empty {
    background-color: #f8f9fa;
    cursor: default;
}

.calendar-day.empty:hover {
    transform: none;
}

.calendar-day.has-images {
    background-color: #d1e7dd;
    border-color: #198754;
}

.calendar-day.has-images:hover {
    background-color: #badbcc;
}

.day-number {
    font-weight: bold;
    font-size: 1.1rem;
}

.image-count {
    font-size: 0.9rem;
    color: #198754;
    margin-top: 5px;
}

.calendar-day.today {
    border: 2px solid #198754;
    box-shadow: 0 0 10px rgba(25, 135, 84, 0.3);
}

/* モバイル対応 */
@media (max-width: 768px) {
    .calendar-grid {
        grid-auto-rows: minmax(80px, auto);
    }
    
    .calendar-day {
        min-height: 80px;
        padding: 6px;
    }
    
    .calendar-day-header {
        padding: 8px;
        font-size: 0.9rem;
    }
    
    .day-number {
        font-size: 1rem;
    }
}

@media (max-width: 576px) {
    .calendar-grid {
        grid-auto-rows: minmax(70px, auto);
        gap: 3px;
    }
    
    .calendar-day {
        min-height: 70px;
        padding: 5px;
    }
    
    .calendar-day-header {
        padding: 6px;
        font-size: 0.85rem;
    }
    
    .day-number {
        font-size: 0.9rem;
    }
    
    .image-count {
        font-size: 0.75rem;
    }
}

/* サムネイル */
.thumbnail-img {
    cursor: pointer;
    transition: transform 0.2s;
    border-radius: 5px;
}

.thumbnail-img:hover {
    transform: scale(1.05);
}
</style>

<!-- Markdown レンダリング用ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
// グローバル変数
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-11
let currentLayerId = 1;
let imagesByDate = {}; // 日付ごとの画像データ
let allImages = []; // 全画像データ
let currentModalDate = null; // 現在モーダルで表示中の日付
let imageModalInstance = null; // モーダルインスタンス（再利用）

// 月の変更
function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
    } else if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
    }
    loadGallery();
}

// ギャラリー読み込み
function loadGallery() {
    currentLayerId = parseInt(document.getElementById('layer-select').value);
    
    // 月表示を更新
    const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    document.getElementById('current-month-text').textContent = `${currentYear}年 ${monthNames[currentMonth]}`;
    
    // 画像一覧を取得
    fetch(`/api/images?layer_id=${currentLayerId}&limit=1000`)
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                allImages = result.images;
                processImages();
                renderCalendar();
            } else {
                console.error('Failed to load images:', result.error);
            }
        })
        .catch(error => {
            console.error('Error fetching images:', error);
        });
}

// 画像データを日付ごとに整理
function processImages() {
    imagesByDate = {};
    
    allImages.forEach(img => {
        // ファイル名から日付を抽出: 20250910_100000.jpg -> 2025-09-10
        const filename = img.image_path.split('/').pop();
        const match = filename.match(/^(\d{4})(\d{2})(\d{2})_/);
        
        if (match) {
            const dateStr = `${match[1]}-${match[2]}-${match[3]}`;
            
            if (!imagesByDate[dateStr]) {
                imagesByDate[dateStr] = [];
            }
            
            imagesByDate[dateStr].push({
                path: img.image_path,
                timestamp: img.timestamp,
                date: dateStr
            });
        }
    });
}

// カレンダーをレンダリング
function renderCalendar() {
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';
    
    // 今月の1日
    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0);
    
    // 曜日のオフセット
    const startDayOfWeek = firstDay.getDay();
    
    // 今日の日付
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    
    let hasImages = false;
    
    // 空白セルを追加
    for (let i = 0; i < startDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-day empty';
        grid.appendChild(emptyCell);
    }
    
    // 日付セルを追加
    for (let day = 1; day <= lastDay.getDate(); day++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const images = imagesByDate[dateStr] || [];
        
        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        
        if (dateStr === todayStr) {
            cell.classList.add('today');
        }
        
        if (images.length > 0) {
            cell.classList.add('has-images');
            hasImages = true;
            cell.onclick = () => openModal(dateStr);
        }
        
        const dayNum = document.createElement('div');
        dayNum.className = 'day-number';
        dayNum.textContent = day;
        cell.appendChild(dayNum);
        
        if (images.length > 0) {
            const count = document.createElement('div');
            count.className = 'image-count';
            count.innerHTML = `<i class="fas fa-camera"></i> ${images.length}`;
            cell.appendChild(count);
        }
        
        grid.appendChild(cell);
    }
    
    // 画像なしメッセージの表示切り替え
    document.getElementById('no-images-message').style.display = hasImages ? 'none' : 'block';
}

// モーダルを開く
function openModal(dateStr) {
    currentModalDate = dateStr;
    
    // モーダルの内容を更新
    updateModalContent(dateStr);
    
    // モーダルが既に開いている場合は何もしない、開いていない場合のみ開く
    if (!imageModalInstance) {
        imageModalInstance = new bootstrap.Modal(document.getElementById('imageModal'));
        // モーダルが閉じられたらインスタンスをリセット
        document.getElementById('imageModal').addEventListener('hidden.bs.modal', function () {
            imageModalInstance = null;
        });
    }
    
    imageModalInstance.show();
}

// モーダルの内容を更新（日付変更時に使用）
function updateModalContent(dateStr) {
    const images = imagesByDate[dateStr] || [];
    
    currentModalDate = dateStr;
    
    // 日付表示
    const date = new Date(dateStr);
    document.getElementById('modal-date').textContent = 
        `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
    
    // AI解析レポートセクションを非表示にする（日付が変わったら一旦隠す）
    document.getElementById('ai-report-section').style.display = 'none';
    
    // 画像がある場合は表示、ない場合はメッセージ表示
    if (images.length > 0) {
        showImage(images[0], images);
    } else {
        showNoImageMessage();
    }
}

// 画像を表示
function showImage(imageData, allDayImages) {
    const modalImage = document.getElementById('modal-image');
    modalImage.src = '/' + imageData.path;
    modalImage.style.display = 'block';
    modalImage.parentElement.querySelector('.no-image-message')?.remove();
    
    // センサーデータを取得（画像のタイムスタンプに近いデータ）
    fetchSensorData(imageData.timestamp);
    
    // AI解析レポートを取得
    fetchAIReportForImage(imageData.path);
    
    // センサー情報を表示
    document.getElementById('sensor-info').style.display = 'flex';
    
    // 同じ日の他の画像
    if (allDayImages.length > 1) {
        document.getElementById('same-day-images').style.display = 'block';
        document.getElementById('same-day-count').textContent = allDayImages.length;
        
        const thumbnailsContainer = document.getElementById('same-day-thumbnails');
        thumbnailsContainer.innerHTML = '';
        
        allDayImages.forEach(img => {
            const col = document.createElement('div');
            col.className = 'col-4';
            col.innerHTML = `<img src="/${img.path}" class="img-fluid thumbnail-img" onclick="showImage(${JSON.stringify(img).replace(/"/g, '&quot;')}, ${JSON.stringify(allDayImages).replace(/"/g, '&quot;')})">`;
            thumbnailsContainer.appendChild(col);
        });
    } else {
        document.getElementById('same-day-images').style.display = 'none';
    }
}

// 画像なしメッセージを表示
function showNoImageMessage() {
    const modalImage = document.getElementById('modal-image');
    modalImage.style.display = 'none';
    
    // 既存のメッセージを削除
    modalImage.parentElement.querySelector('.no-image-message')?.remove();
    
    // メッセージを追加
    const noImageDiv = document.createElement('div');
    noImageDiv.className = 'no-image-message text-center py-5';
    noImageDiv.innerHTML = `
        <i class="fas fa-image fa-3x text-muted mb-3"></i>
        <h5 class="text-muted">この日は画像がありません</h5>
        <p class="text-muted mb-0">前後の日の画像を確認してください</p>
    `;
    modalImage.parentElement.appendChild(noImageDiv);
    
    // センサー情報を非表示
    document.getElementById('sensor-info').style.display = 'none';
    
    // 同じ日の他の画像を非表示
    document.getElementById('same-day-images').style.display = 'none';
}

// センサーデータを取得
function fetchSensorData(timestamp) {
    // TODO: タイムスタンプに近いセンサーデータを取得する実装
    // 現在は最新データを取得しているが、画像撮影時刻に最も近いデータを取得すべき
    // 実装例: fetch(`/api/sensor-data-at-time?timestamp=${timestamp}`)
    fetch(`/api/dashboard-data`)
        .then(response => response.json())
        .then(result => {
            if (result.success && result.sensor_data) {
                const data = result.sensor_data;
                document.getElementById('modal-temp').textContent = 
                    data.temperature !== null ? `${data.temperature}℃` : 'N/A';
                document.getElementById('modal-humidity').textContent = 
                    data.humidity !== null ? `${data.humidity}%` : 'N/A';
            }
        })
        .catch(error => {
            console.error('Error fetching sensor data:', error);
        });
}

// Markdownプレビュー用ヘルパー（ダッシュボードと同じ）
function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return text.replace(/[&<>'"]/g, function(ch) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' };
        return map[ch] || ch;
    });
}

function stripMarkdown(text) {
    if (!text) return '';
    return text
        .replace(/```[\s\S]*?```/g, '')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/\[[^\]]*\]\([^)]*\)/g, '$1')
        .replace(/[#!*_>~`]/g, '')
        .replace(/\r\n/g, '\n')
        .replace(/\n+/g, ' ')
        .trim();
}

function extractSummaryPreview(markdown, maxChars = 150) {
    if (!markdown) {
        return { html: '', truncated: false };
    }
    const paragraphs = markdown.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const source = paragraphs.length ? paragraphs[0] : markdown;
    const plain = stripMarkdown(source);
    if (!plain) {
        return { html: '', truncated: false };
    }
    let truncated = false;
    let preview = plain;
    if (plain.length > maxChars) {
        truncated = true;
        preview = plain.slice(0, maxChars).trim();
    }
    if (truncated) {
        preview = preview.replace(/[。！!?.,\s]*$/, '');
        preview += '…';
    }
    return { html: escapeHtml(preview), truncated };
}

function extractAdvicePreview(markdown, maxItems = 2, maxCharsPerItem = 120) {
    if (!markdown) {
        return { listHtml: '', remaining: 0 };
    }
    const lines = markdown.split('\n');
    const bulletPattern = /^(\s*[-*•]\s+|\s*\d+\.\s+)/;
    const tips = [];
    for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        if (bulletPattern.test(trimmed)) {
            let content = trimmed.replace(bulletPattern, '').trim();
            content = stripMarkdown(content);
            if (content) {
                tips.push(content);
            }
        }
    }
    if (tips.length === 0) {
        return { listHtml: '', remaining: 0 };
    }
    const previewItems = [];
    const limit = Math.min(tips.length, maxItems);
    for (let i = 0; i < limit; i++) {
        let item = tips[i];
        if (item.length > maxCharsPerItem) {
            item = item.slice(0, maxCharsPerItem).trim();
            item = item.replace(/[。！!?.,\s]*$/, '');
            item += '…';
        }
        previewItems.push(`<li>${escapeHtml(item)}</li>`);
    }
    const remaining = tips.length - limit;
    return { listHtml: previewItems.join(''), remaining };
}

// AI解析レポートを取得
function fetchAIReportForImage(imagePath) {
    const reportSection = document.getElementById('ai-report-section');
    const reportContent = document.getElementById('gallery-ai-report-content');
    
    // API経由で画像に対応するAI解析レポートを取得
    fetch(`/api/ai-report-by-image?image_path=${encodeURIComponent(imagePath)}`)
        .then(response => response.json())
        .then(data => {
            if (data.success && data.report) {
                const report = data.report;
                const stars = getGalleryStarRating(report.growth_rate);
                const timestamp = new Date(report.timestamp).toLocaleString('ja-JP');
                
                // 要約表示用にプレビューを生成
                const summaryPreview = extractSummaryPreview(report.ai_summary, 150);
                const advicePreview = extractAdvicePreview(report.ai_advice, 2, 120);
                
                reportContent.innerHTML = `
                    <div class="d-flex align-items-center mb-3">
                        <div class="me-3">
                            <div style="font-size: 2rem;">${stars}</div>
                        </div>
                        <div>
                            <h5 class="mb-1">成長率: ${report.growth_rate}%</h5>
                            <small class="text-muted">
                                <i class="fas fa-clock"></i> ${timestamp}
                            </small>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <h6 class="text-muted">状態サマリー</h6>
                        <p class="mb-0">${summaryPreview.html}</p>
                    </div>
                    
                    ${advicePreview.listHtml ? `
                    <div class="mb-3">
                        <h6 class="text-muted"><i class="fas fa-lightbulb text-warning"></i> アドバイス</h6>
                        <ul class="mb-2">
                            ${advicePreview.listHtml}
                        </ul>
                        ${advicePreview.remaining > 0 ? `
                        <small class="text-muted">…ほか${advicePreview.remaining}件</small>
                        ` : ''}
                    </div>
                    ` : ''}
                    
                    <button class="btn btn-success btn-sm w-100" onclick="showGalleryAIDetailModal(${report.report_id})">
                        <i class="fas fa-search-plus"></i> 詳細を見る
                    </button>
                `;
                
                reportSection.style.display = 'block';
            } else {
                // AI解析レポートがない場合は非表示
                reportSection.style.display = 'none';
            }
        })
        .catch(error => {
            console.error('Error fetching AI report:', error);
            reportSection.style.display = 'none';
        });
}

// 成長率から星評価を生成（ギャラリー用）
function getGalleryStarRating(growthRate) {
    const starCount = Math.ceil(growthRate / 20);
    const fullStars = '⭐'.repeat(Math.min(starCount, 5));
    const emptyStars = '☆'.repeat(Math.max(0, 5 - starCount));
    return fullStars + emptyStars;
}

// アドバイステキストをフォーマット（ギャラリー用）
function formatGalleryAdvice(advice) {
    if (!advice) return 'アドバイスなし';
    
    const lines = advice.split('\n');
    let formatted = '';
    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('•') || line.startsWith('-') || line.startsWith('*')) {
            formatted += line.substring(1).trim() + '<br>';
        } else if (line) {
            formatted += line + '<br>';
        }
    });
    
    return formatted || advice;
}

// 前後の日へ移動
function navigateDay(delta) {
    if (!currentModalDate) return;
    
    const currentDate = new Date(currentModalDate);
    currentDate.setDate(currentDate.getDate() + delta);
    
    const newDateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;
    
    // モーダルの内容のみを更新（新しくモーダルを開かない）
    updateModalContent(newDateStr);
}

// ギャラリー用AI詳細モーダルを表示
function showGalleryAIDetailModal(reportId) {
    // APIでレポート詳細を取得
    fetch(`/api/ai-report/${reportId}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const report = data.report;
                const modalBody = document.getElementById('gallery-ai-modal-body');
                const timestamp = new Date(report.timestamp).toLocaleString('ja-JP');
                const stars = getGalleryStarRating(report.growth_rate);
                
                // MarkdownをHTMLに変換（全文表示）
                const summaryHtml = report.ai_summary ? marked.parse(report.ai_summary) : 'データなし';
                const adviceHtml = report.ai_advice ? marked.parse(report.ai_advice) : 'アドバイスなし';
                
                modalBody.innerHTML = `
                    <div class="text-center mb-4">
                        ${report.image_path ? 
                            `<img src="/${report.image_path}" alt="分析画像" 
                                  class="img-fluid rounded mb-3" style="max-height: 400px;">` 
                            : ''}
                        <div class="mb-2">
                            <div style="font-size: 3rem;">${stars}</div>
                        </div>
                        <h4>成長率: ${report.growth_rate}%</h4>
                        <small class="text-muted">
                            <i class="fas fa-clock"></i> ${timestamp}
                        </small>
                    </div>
                    
                    <div class="mb-4">
                        <h5><i class="fas fa-clipboard-check text-success"></i> 状態サマリー</h5>
                        <div class="markdown-content lead">${summaryHtml}</div>
                    </div>
                    
                    <div class="mb-4">
                        <h5><i class="fas fa-lightbulb text-warning"></i> アドバイス</h5>
                        <div class="alert alert-info markdown-content">
                            ${adviceHtml}
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <h6 class="text-muted"><i class="fas fa-info-circle"></i> 分析情報</h6>
                        <ul class="list-unstyled small">
                            <li><strong>レイヤー:</strong> Layer ${report.layer_id}</li>
                            <li><strong>モデル:</strong> ${report.llm_model_name || 'N/A'}</li>
                            <li><strong>分析日時:</strong> ${timestamp}</li>
                        </ul>
                    </div>
                `;
                
                // モーダルを表示
                const modal = new bootstrap.Modal(document.getElementById('galleryAIDetailModal'));
                modal.show();
            }
        })
        .catch(error => {
            console.error('AI詳細取得エラー:', error);
            alert('AI解析レポートの取得に失敗しました。');
        });
}

// 初期化
document.addEventListener('DOMContentLoaded', function() {
    loadGallery();
});
</script>
