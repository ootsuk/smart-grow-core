{% extends "base.html" %}

{% block title %}スケジュール管理 - Smart Grow System{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h1 class="display-6">
                📅 スケジュール管理
            </h1>
            <p class="text-muted">ジョブの実行タイミングを管理</p>
        </div>
    </div>

    <!-- フィルター -->
    <div class="row mb-3">
        <div class="col-12 col-md-6 mb-2">
            <label class="form-label small text-muted">レイヤー</label>
            <select class="form-select" id="layer-filter" onchange="applyFilters()">
                <option value="">全て</option>
                <option value="0">System (Layer 0)</option>
                <option value="1">Layer 1</option>
            </select>
        </div>
        <div class="col-12 col-md-6 mb-2">
            <label class="form-label small text-muted">ジョブ種別</label>
            <select class="form-select" id="job-filter" onchange="applyFilters()">
                <option value="">全て</option>
                <option value="camera">📷 カメラ</option>
                <option value="sensor">📊 センサー</option>
                <option value="water">💧 水やり</option>
            </select>
        </div>
    </div>

    <!-- 検索結果 -->
    <div class="row mb-3">
        <div class="col">
            <div class="alert alert-light mb-0 py-2">
                <small>
                    <i class="fas fa-calendar-check"></i> スケジュール数: <strong id="result-count">0</strong>件
                    <span class="ms-3">
                        <i class="fas fa-sync-alt"></i> 最終更新: <span id="last-update">-</span>
                    </span>
                </small>
            </div>
        </div>
    </div>

    <!-- スケジュール一覧 -->
    <div class="row">
        <div class="col-12">
            <div id="schedules-container">
                <!-- スケジュールがここに表示される -->
                <div class="text-center py-5">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">読み込み中...</span>
                    </div>
                </div>
            </div>

            <!-- データなしメッセージ -->
            <div class="text-center py-5" id="no-schedules-message" style="display: none;">
                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                <p class="text-muted">該当するスケジュールがありません</p>
            </div>
        </div>
    </div>
</div>

<!-- 編集モーダル -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-edit text-success"></i> スケジュール編集
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">ジョブ種別</label>
                    <p id="modal-job-type" class="fw-bold"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label">レイヤー</label>
                    <p id="modal-layer" class="fw-bold"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label">実行時刻</label>
                    <div class="row g-2">
                        <div class="col-4">
                            <input type="number" class="form-control text-center" id="modal-hour" 
                                   min="0" max="23" placeholder="時">
                            <small class="text-muted d-block text-center">時</small>
                        </div>
                        <div class="col-4">
                            <input type="number" class="form-control text-center" id="modal-minute" 
                                   min="0" max="59" placeholder="分">
                            <small class="text-muted d-block text-center">分</small>
                        </div>
                        <div class="col-4">
                            <input type="number" class="form-control text-center" id="modal-second" 
                                   min="0" max="59" placeholder="秒">
                            <small class="text-muted d-block text-center">秒</small>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">次回実行予定</label>
                    <p id="modal-next-exec" class="text-muted"></p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                <button type="button" class="btn btn-success" onclick="saveSchedule()">
                    <i class="fas fa-save"></i> 保存
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
// グローバル変数
let allSchedules = [];
let filteredSchedules = [];
let currentEditingId = null;
let updateInterval = null;
let editModal = null;

// ジョブアイコン取得
function getJobIcon(jobType) {
    const icons = {
        'camera': '📷',
        'sensor': '📊',
        'water': '💧'
    };
    return icons[jobType] || '🔧';
}

// ジョブラベル取得
function getJobLabel(jobType) {
    const labels = {
        'camera': 'カメラ撮影',
        'sensor': 'センサー測定',
        'water': '水やり'
    };
    return labels[jobType] || jobType;
}

// 次回実行時刻を計算
function calculateNextExecution(execTime) {
    const now = new Date();
    const [hours, minutes, seconds] = execTime.split(':').map(Number);
    
    const next = new Date(now);
    next.setHours(hours, minutes, seconds || 0, 0);
    
    // 今日の実行時刻が過ぎていたら明日
    if (next <= now) {
        next.setDate(next.getDate() + 1);
    }
    
    return next;
}

// スケジュール読み込み
function loadSchedules() {
    fetch('/api/schedules')
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                allSchedules = result.schedules;
                applyFilters();
                
                // 最終更新時刻
                const now = new Date();
                document.getElementById('last-update').textContent = now.toLocaleTimeString('ja-JP');
            } else {
                console.error('Failed to load schedules:', result.error);
            }
        })
        .catch(error => {
            console.error('Error fetching schedules:', error);
        });
}

// フィルター適用
function applyFilters() {
    const layerFilter = document.getElementById('layer-filter').value;
    const jobFilter = document.getElementById('job-filter').value;
    
    filteredSchedules = allSchedules.filter(schedule => {
        // レイヤーフィルター
        if (layerFilter && schedule.layer_id.toString() !== layerFilter) {
            return false;
        }
        
        // ジョブ種別フィルター
        if (jobFilter && schedule.job_type !== jobFilter) {
            return false;
        }
        
        return true;
    });
    
    // 結果件数表示
    document.getElementById('result-count').textContent = filteredSchedules.length;
    
    // 表示
    renderSchedules();
}

// スケジュールをレンダリング
function renderSchedules() {
    const container = document.getElementById('schedules-container');
    
    container.innerHTML = '';
    
    if (filteredSchedules.length === 0) {
        document.getElementById('no-schedules-message').style.display = 'block';
        return;
    }
    
    document.getElementById('no-schedules-message').style.display = 'none';
    
    filteredSchedules.forEach(schedule => {
        const card = createScheduleCard(schedule);
        container.appendChild(card);
    });
}

// スケジュールカードを作成
function createScheduleCard(schedule) {
    const card = document.createElement('div');
    card.className = 'card mb-3 shadow-sm';
    
    const jobIcon = getJobIcon(schedule.job_type);
    const jobLabel = getJobLabel(schedule.job_type);
    const nextExec = calculateNextExecution(schedule.exec_time);
    const nextExecStr = nextExec.toLocaleString('ja-JP');
    
    // 時間を分かりやすく表示
    const timeStr = schedule.exec_time.substring(0, 5); // HH:MM
    
    // 有効/無効の状態
    const isEnabled = schedule.is_enabled;
    const statusBadge = isEnabled 
        ? '<span class="badge bg-success">有効</span>' 
        : '<span class="badge bg-secondary">無効</span>';
    
    card.innerHTML = `
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-12 col-md-6 mb-2 mb-md-0">
                    <h5 class="mb-1">
                        ${jobIcon} ${jobLabel}
                    </h5>
                    <small class="text-muted">Layer ${schedule.layer_id}</small>
                </div>
                
                <div class="col-6 col-md-2 mb-2 mb-md-0">
                    <small class="text-muted d-block">実行時刻</small>
                    <strong class="fs-5">${timeStr}</strong>
                </div>
                
                <div class="col-6 col-md-2 mb-2 mb-md-0">
                    ${statusBadge}
                </div>
                
                <div class="col-12 col-md-2 text-md-end">
                    <div class="btn-group" role="group">
                        <button class="btn btn-sm ${isEnabled ? 'btn-success' : 'btn-outline-secondary'}" 
                                onclick="toggleSchedule(${schedule.schedule_id})"
                                title="${isEnabled ? '無効にする' : '有効にする'}">
                            <i class="fas fa-power-off"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-primary" 
                                onclick="openEditModal(${schedule.schedule_id})"
                                title="編集">
                            <i class="fas fa-edit"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            ${isEnabled ? `
            <div class="row mt-2">
                <div class="col-12">
                    <small class="text-muted">
                        <i class="fas fa-clock"></i> 次回実行: ${nextExecStr}
                    </small>
                </div>
            </div>
            ` : ''}
        </div>
    `;
    
    return card;
}

// トグル切り替え
function toggleSchedule(scheduleId) {
    fetch(`/api/schedules/${scheduleId}/toggle`, {
        method: 'PATCH'
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            // 再読み込み
            loadSchedules();
        } else {
            alert('エラー: ' + result.error);
        }
    })
    .catch(error => {
        console.error('Error toggling schedule:', error);
        alert('スケジュールの切り替えに失敗しました');
    });
}

// 編集モーダルを開く
function openEditModal(scheduleId) {
    const schedule = allSchedules.find(s => s.schedule_id === scheduleId);
    if (!schedule) return;
    
    currentEditingId = scheduleId;
    
    // モーダルに情報を設定
    const jobIcon = getJobIcon(schedule.job_type);
    const jobLabel = getJobLabel(schedule.job_type);
    document.getElementById('modal-job-type').innerHTML = `${jobIcon} ${jobLabel}`;
    document.getElementById('modal-layer').textContent = `Layer ${schedule.layer_id}`;
    
    // 時刻を分解
    const [hours, minutes, seconds] = schedule.exec_time.split(':').map(Number);
    document.getElementById('modal-hour').value = hours;
    document.getElementById('modal-minute').value = minutes;
    document.getElementById('modal-second').value = seconds || 0;
    
    // 次回実行予定
    updateNextExecPreview();
    
    // モーダルを表示
    editModal.show();
}

// 次回実行予定のプレビューを更新
function updateNextExecPreview() {
    const hour = parseInt(document.getElementById('modal-hour').value) || 0;
    const minute = parseInt(document.getElementById('modal-minute').value) || 0;
    const second = parseInt(document.getElementById('modal-second').value) || 0;
    
    const execTime = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}:${String(second).padStart(2, '0')}`;
    const nextExec = calculateNextExecution(execTime);
    
    document.getElementById('modal-next-exec').textContent = nextExec.toLocaleString('ja-JP');
}

// スケジュールを保存
function saveSchedule() {
    const hour = parseInt(document.getElementById('modal-hour').value);
    const minute = parseInt(document.getElementById('modal-minute').value);
    const second = parseInt(document.getElementById('modal-second').value) || 0;
    
    // バリデーション
    if (isNaN(hour) || hour < 0 || hour > 23) {
        alert('時間は0〜23の範囲で入力してください');
        return;
    }
    if (isNaN(minute) || minute < 0 || minute > 59) {
        alert('分は0〜59の範囲で入力してください');
        return;
    }
    if (isNaN(second) || second < 0 || second > 59) {
        alert('秒は0〜59の範囲で入力してください');
        return;
    }
    
    const execTime = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}:${String(second).padStart(2, '0')}`;
    
    // API呼び出し
    fetch(`/api/schedules/${currentEditingId}`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            exec_time: execTime
        })
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            editModal.hide();
            loadSchedules();
        } else {
            alert('エラー: ' + result.error);
        }
    })
    .catch(error => {
        console.error('Error saving schedule:', error);
        alert('スケジュールの保存に失敗しました');
    });
}

// 初期化
document.addEventListener('DOMContentLoaded', function() {
    // モーダル初期化
    editModal = new bootstrap.Modal(document.getElementById('editModal'));
    
    // 時刻入力のプレビュー更新
    ['modal-hour', 'modal-minute', 'modal-second'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateNextExecPreview);
    });
    
    // スケジュール読み込み
    loadSchedules();
    
    // 30秒ごとに自動更新
    updateInterval = setInterval(loadSchedules, 30000);
});

// ページを離れるときにインターバルをクリア
window.addEventListener('beforeunload', function() {
    if (updateInterval) {
        clearInterval(updateInterval);
    }
});
</script>
{% endblock %}
